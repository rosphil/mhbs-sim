[project]
name = "shbss-sim"
version = "0.1.0"
description = "SHBSS simulation and track processing"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "cantools",
  "python-can",
  "numpy",
  "pandas",
  "geopandas",
  "plotly",
  "simple-pid",
  "sqlalchemy>=2.1.0",
  "pyyaml>=6.0.3",
  "psycopg[binary]>=3.3.6",
  "pyarrow>=25.0.1",
]

[tool.uv]
package = false
